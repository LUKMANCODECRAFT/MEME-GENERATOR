<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="IMG-20250804-WA0006.jpg" type="image/x-icon">
  <title>Meme Generator</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e272e, #485460);
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    h2 {
      font-size: 2.5rem;
      animation: floatTitle 3s infinite ease-in-out;
    }

    @keyframes floatTitle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .container {
      background: #2f3640;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      max-width: 450px;
      margin: auto;
      transition: transform 0.3s ease;
    }
    .container:hover {
      transform: scale(1.02);
    }

    /*Controls*/
    input[type="file"], input[type="text"] {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background: #ff4757;
      color: white;
      border: none;
      padding: 12px;
      width: 90%;
      cursor: pointer;
      font-size: 18px;
      margin-top: 10px;
      border-radius: 6px;
      transition: all 0.3s ease-in-out;
    }
    button:hover {
      background: #e84118;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(255,71,87,0.4);
    }

    /*Canvas Styling*/
    #memeCanvas {
      max-width: 100%;
      border: 3px solid #fff;
      margin-top: 15px;
      border-radius: 8px;
      opacity: 0;
      transform: scale(0.9);
      transition: all 0.5s ease-in-out;
    }
    #memeCanvas.show {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body>
  <h2>🔥 Meme Generator 🔥</h2>
  <div class="container">
    <input type="file" id="imageInput" accept="image/*"><br>
    <input type="text" id="topText" placeholder="Top Text"><br>
    <input type="text" id="bottomText" placeholder="Bottom Text"><br>
    <button onclick="downloadMeme()">Download Meme</button>
    <canvas id="memeCanvas"></canvas>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const topText = document.getElementById('topText');
    const bottomText = document.getElementById('bottomText');
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    let image = null;

    // Load image
    imageInput.addEventListener('change', (event) => {
      const reader = new FileReader();
      reader.onload = function() {
        image = new Image();
        image.src = reader.result;
        image.onload = drawMeme;
      };
      reader.readAsDataURL(event.target.files[0]);
    });

    // Update text
    topText.addEventListener('input', drawMeme);
    bottomText.addEventListener('input', drawMeme);

    function drawMeme() {
      if (!image) return;
      canvas.width = image.width;
      canvas.height = image.height;
      ctx.drawImage(image, 0, 0);

      ctx.font = `${canvas.width / 10}px Impact`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 5;
      ctx.fillStyle = 'white';

      // Top text
      ctx.textBaseline = 'top';
      ctx.strokeText(topText.value.toUpperCase(), canvas.width / 2, 10);
      ctx.fillText(topText.value.toUpperCase(), canvas.width / 2, 10);

      // Bottom text
      ctx.textBaseline = 'bottom';
      ctx.strokeText(bottomText.value.toUpperCase(), canvas.width / 2, canvas.height - 10);
      ctx.fillText(bottomText.value.toUpperCase(), canvas.width / 2, canvas.height - 10);

      // Animate canvas on every change
      canvas.classList.add('show');
    }

    function downloadMeme() {
      const link = document.createElement('a');
      link.download = 'meme.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
